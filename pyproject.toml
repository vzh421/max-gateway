[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "max-gateway"
version = "0.1.0"
description = "Шлюз MAX для общения арбитражного управляющего с должниками"
requires-python = ">=3.11"
# Версии зафиксированы точно: библиотека MAX неофициальная, API меняется между версиями.
dependencies = [
    "maxapi-python==2.4.1",
    "sqlalchemy[asyncio]==2.1.1",
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "aiosqlite==0.22.1",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.package-data]
gateway = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
